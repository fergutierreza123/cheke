<!doctype html>
<!--
  Bundled inside the iPhone/Android app (capacitor.config.ts → server.errorPath)
  and shown when the app can't reach the cheKe site, e.g. no internet. It has
  no access to the network, so everything it needs is in this one file.
  APP_URL must match server.url in capacitor.config.ts.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001037" />
    <title>Sin conexión · cheke</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #001037;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Work Sans", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
      }
      img {
        width: 64px;
        height: auto;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      p {
        margin: 10px 0 0;
        max-width: 320px;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.7);
      }
      button {
        margin-top: 28px;
        min-height: 48px;
        min-width: 200px;
        border: 0;
        border-radius: 12px;
        background: #52ebbb;
        color: #001037;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.1s;
      }
      button:active {
        opacity: 0.7;
      }
      .status {
        margin-top: 14px;
        min-height: 20px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logos/cheke-icon-mint.png" alt="" />
      <h1>Sin conexión a internet</h1>
      <p>Revisa tu wifi o tus datos móviles. Tus conversaciones siguen guardadas y aparecen apenas vuelvas a estar en línea.</p>
      <button type="button" id="retry">Reintentar</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
      (function () {
        var APP_URL = "https://cheke.io/";
        var statusEl = document.getElementById("status");
        function retry() {
          statusEl.textContent = "Conectando…";
          window.location.replace(APP_URL);
        }
        document.getElementById("retry").addEventListener("click", retry);
        // Come back on our own as soon as the phone reconnects.
        window.addEventListener("online", retry);
      })();
    </script>
  </body>
</html>
