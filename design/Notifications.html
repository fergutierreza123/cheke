<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificaciones</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Cheke brand — exact values from the brand manual (Azul oscuro / Azul intenso / Menta / Blanco) */
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EDF0F7; --surface-3:#DCE1EE;
  --ink:#0B1030; --ink-muted:#5B6584; --ink-soft:#5F6888; --border:#DCE1EE;
  --brand:#0043F8; --brand-dark:#001037; --brand-tint:#E7ECFE;
  --accent:#52EBBB; --accent-tint:#DFFBF1;
  --gold:#002997; --gold-tint:#E4E9FB;
  --success:#0043F8; --success-tint:#E7ECFE;
  --danger:#DC2626; --danger-tint:#FDECEC; --danger-border:#F6BFBF;
  --wa:#25D366; --ig:#C1387B; --fb:#1877F2;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--ink);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
</style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; background: var(--bg);">

  <div style="width: 240px; min-width: 240px; height: 900px; background: var(--brand-dark); display: flex; flex-direction: column; padding: 24px 0;">
    <div style="padding: 4px 24px 22px 24px;">
      <img src="assets/logo-a.png" alt="Cheke" style="width: 148px; height: auto; display: block;">
    </div>

    <a href="Inbox.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #A9B1CC; text-decoration: none; border-left: 3px solid transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.5-.3-3.6-.8L3 21l1.8-5.4A8.5 8.5 0 1 1 21 11.5z"></path></svg>
      <span style="font-size: 14.5px;">Chat</span>
    </a>
    <a href="Main.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #A9B1CC; text-decoration: none; border-left: 3px solid transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="4" height="16"></rect><rect x="10" y="4" width="4" height="10"></rect><rect x="17" y="4" width="4" height="7"></rect></svg>
      <span style="font-size: 14.5px;">Chekeo</span>
    </a>
    <a href="Contacts.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #A9B1CC; text-decoration: none; border-left: 3px solid transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span style="font-size: 14.5px;">Contactos</span>
    </a>
    <a href="Comments.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #A9B1CC; text-decoration: none; border-left: 3px solid transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span style="font-size: 14.5px;">Comentarios</span>
    </a>
    <a href="Templates.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #A9B1CC; text-decoration: none; border-left: 3px solid transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg>
      <span style="font-size: 14.5px;">Plantillas</span>
    </a>
    <a href="Inventory.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #A9B1CC; text-decoration: none; border-left: 3px solid transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.89 1.45l8 4A2 2 0 0 1 22 7.24v9.53a2 2 0 0 1-1.11 1.79l-8 4a2 2 0 0 1-1.79 0l-8-4a2 2 0 0 1-1.1-1.8V7.24a2 2 0 0 1 1.11-1.79l8-4a2 2 0 0 1 1.78 0z"></path><path d="M2.32 6.16L12 11l9.68-4.84"></path><path d="M12 22.76V11"></path></svg>
      <span style="font-size: 14.5px;">Inventario</span>
    </a>
    <a href="Team.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #A9B1CC; text-decoration: none; border-left: 3px solid transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
      <span style="font-size: 14.5px;">Equipo</span>
    </a>
    <div style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #FFFFFF; background: rgba(255,255,255,0.06); border-left: 3px solid var(--accent); font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span style="font-size: 14.5px;">Notificaciones</span>
    </div>
    <a href="Analytics.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #A9B1CC; text-decoration: none; border-left: 3px solid transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10"></path><path d="M12 19V5"></path><path d="M20 19v-7"></path></svg>
      <span style="font-size: 14.5px;">Analítica</span>
    </a>

    <div style="margin-top: auto; padding: 16px 24px 0 24px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 10px; padding-top: 16px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; padding: 7px; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255,255,255,0.15);"><img src="assets/logo-b.png" alt="" style="width: 100%; height: 100%; object-fit: contain;"></div>
      <div>
        <div style="font-size: 13.5px; font-weight: 600; color: #FFFFFF;">Boutique Alaia</div>
        <div style="font-size: 12px; color: #9AA3C4;">Tegucigalpa, HN</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">

    <div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--border); background: var(--surface);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 600; color: var(--ink);">Notificaciones</div>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{false}}">
          <div style="background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 2px 9px;">{{unreadCount}} nuevas</div>
        </sc-if>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="display: flex; gap: 6px;">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="2">
            <button onClick="{{f.onPick}}" style="border: 1px solid {{f.borderStyle}}; background: {{f.bgStyle}}; color: {{f.textStyle}}; border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer;">{{f.label}}</button>
          </sc-for>
        </div>
        <button onClick="{{onMarkAllRead}}" style="background: var(--surface-2); color: var(--ink-muted); border: none; border-radius: 8px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer;">Marcar todas como leídas</button>
      </div>
    </div>

    <div style="flex-grow: 1; overflow-y: auto; padding: 20px 32px 24px 32px;">
      <div style="display: flex; flex-direction: column; gap: 8px; max-width: 760px;">
        <sc-for list="{{notifications}}" as="n" hint-placeholder-count="6">
          <a href="{{n.link}}" onClick="{{n.onOpen}}" style="display: flex; gap: 14px; align-items: flex-start; background: {{n.rowBg}}; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-decoration: none; color: inherit;">
            <div style="width: 38px; height: 38px; border-radius: 10px; background: {{n.iconBg}}; color: {{n.iconColor}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <sc-if value="{{n.isMessage}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.5-.3-3.6-.8L3 21l1.8-5.4A8.5 8.5 0 1 1 21 11.5z"></path></svg>
              </sc-if>
              <sc-if value="{{n.isWarning}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
              </sc-if>
              <sc-if value="{{n.isSuccess}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
              </sc-if>
              <sc-if value="{{n.isComment}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              </sc-if>
              <sc-if value="{{n.isGoal}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
              </sc-if>
            </div>
            <div style="flex-grow: 1; min-width: 0;">
              <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
                <div style="font-size: 13.5px; font-weight: 700; color: var(--ink);">{{n.title}}</div>
                <div style="font-size: 11.5px; color: var(--ink-soft); flex-shrink: 0;">{{n.time}}</div>
              </div>
              <div style="font-size: 13px; color: var(--ink-muted); margin-top: 2px; line-height: 1.4;">{{n.description}}</div>
            </div>
            <sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}">
              <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex-shrink: 0; margin-top: 5px;"></div>
            </sc-if>
          </a>
        </sc-for>
        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
          <div style="text-align: center; padding: 60px 0; color: var(--ink-soft); font-size: 13px;">Ya estás al día — no hay notificaciones sin leer.</div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todas', readOverrides: {} };

    this.kindStyle = {
      message: { bg: 'var(--brand-tint)', color: 'var(--brand-dark)' },
      warning: { bg: 'var(--danger-tint)', color: 'var(--danger)' },
      success: { bg: 'var(--accent-tint)', color: 'var(--brand-dark)' },
      comment: { bg: 'var(--gold-tint)', color: 'var(--gold)' },
      goal: { bg: 'var(--accent-tint)', color: 'var(--brand-dark)' }
    };

    this.baseNotifications = [
      { id:'n1', kind:'message', title:'Nuevo mensaje de Marielos Zúniga', description:'"Buenas! Vi el vestido azul en su estado, ¿todavía lo tienen?" — por WhatsApp', time:'hace 4 min', read:false, link:'Inbox.html' },
      { id:'n2', kind:'comment', title:'Nuevo comentario en tu publicación', description:'Kevin Rápalo preguntó el precio del bolso café en tu foto de Instagram', time:'hace 12 min', read:false, link:'Comments.html' },
      { id:'n3', kind:'warning', title:'3 contactos requieren seguimiento', description:'Llevan más de un día sin respuesta en tu Chekeo — revísalos antes de que se enfríen', time:'hace 1 h', read:false, link:'Main.html' },
      { id:'n4', kind:'success', title:'Venta cerrada — Jonathan Erazo', description:'Traje casual completo, L 1,450 por WhatsApp', time:'hace 1 día', read:true, link:'Contacts.html' },
      { id:'n5', kind:'warning', title:'Poco inventario', description:'"Zapatos casuales beige" y "Bolso café Milán" están por agotarse', time:'hace 1 día', read:true, link:'Inventory.html' },
      { id:'n6', kind:'comment', title:'Nuevo comentario en Facebook', description:'Fátima Reyes escribió "¿Tienen envíos a San Pedro Sula?" en tu publicación', time:'hace 2 días', read:true, link:'Comments.html' },
      { id:'n7', kind:'goal', title:'Meta mensual alcanzada', description:'Carla Ordóñez superó su meta de ventas de este mes', time:'hace 2 días', read:true, link:'Team.html' },
      { id:'n8', kind:'message', title:'Nuevo mensaje de Génesis Martínez', description:'"¿Tienen disponible en talla M?" — por Facebook', time:'hace 3 días', read:true, link:'Inbox.html' }
    ];
  }

  renderVals() {
    const notificationsFull = this.baseNotifications.map((n) => {
      const style = this.kindStyle[n.kind];
      const read = this.state.readOverrides[n.id] !== undefined ? this.state.readOverrides[n.id] : n.read;
      return {
        ...n,
        read,
        unread: !read,
        rowBg: read ? 'var(--surface)' : 'var(--brand-tint)',
        iconBg: style.bg,
        iconColor: style.color,
        isMessage: n.kind === 'message',
        isWarning: n.kind === 'warning',
        isSuccess: n.kind === 'success',
        isComment: n.kind === 'comment',
        isGoal: n.kind === 'goal',
        onOpen: () => this.setState((s) => ({ readOverrides: { ...s.readOverrides, [n.id]: true } }))
      };
    });

    const filtered = this.state.filter === 'no-leidas' ? notificationsFull.filter((n) => n.unread) : notificationsFull;
    const unreadCount = notificationsFull.filter((n) => n.unread).length;

    const filters = [
      { id:'todas', label:'Todas' },
      { id:'no-leidas', label:'No leídas' }
    ].map((f) => {
      const isActive = this.state.filter === f.id;
      return { ...f, onPick: () => this.setState({ filter: f.id }),
        bgStyle: isActive ? 'var(--brand-dark)' : 'var(--surface)',
        textStyle: isActive ? '#FFFFFF' : 'var(--ink-muted)',
        borderStyle: isActive ? 'var(--brand-dark)' : 'var(--border)' };
    });

    return {
      notifications: filtered,
      filters,
      unreadCount,
      hasUnread: unreadCount > 0,
      isEmpty: filtered.length === 0,
      onMarkAllRead: () => {
        const overrides = {};
        this.baseNotifications.forEach((n) => { overrides[n.id] = true; });
        this.setState({ readOverrides: overrides });
      }
    };
  }
}
</script>
</body>
</html>
